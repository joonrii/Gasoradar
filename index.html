<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GasolinaGo — encuentra la gasolina más barata</title>
<meta name="description" content="Encuentra gasolineras baratas cerca de ti en España. Compara gasolina 95, 98 y diésel con precios oficiales actualizados.">
<meta name="robots" content="index,follow">
<meta name="author" content="GasolinaGo">
<meta name="theme-color" content="#09120f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231FE39C'/%3E%3Cpath d='M16 6c-4 6-7 10-7 15a7 7 0 0014 0c0-5-3-9-7-15z' fill='%2309120f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--bg:#09120f;--panel:#0f1e19;--panel2:#12231d;--line:rgba(234,243,239,.11);--text:#edf7f2;--muted:#8ca79d;--accent:#1fe39c;--red:#ff6b5e;--amber:#e3b21f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',sans-serif}button,input{font:inherit}button{cursor:pointer}body{overflow:hidden}.mono{font-family:'DM Mono',monospace}
#home{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 50% 20%,#16372b 0,#09120f 52%);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .3s,visibility .3s}.home-card{width:min(560px,100%);text-align:center}.logo{font:800 30px 'Bricolage Grotesque';margin-bottom:50px}.logo span{color:var(--accent)}.eyebrow{font:500 11px 'DM Mono';letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}.home-card h1{font:800 clamp(38px,7vw,64px) 'Bricolage Grotesque';line-height:.98;margin:0 0 18px;letter-spacing:-.04em}.home-card p{color:var(--muted);font-size:16px;line-height:1.5;margin:0 auto 28px;max-width:450px}.primary{width:100%;padding:15px 18px;border:1px solid var(--accent);border-radius:14px;background:var(--accent);color:#06231a;font-weight:800;font-size:15px;box-shadow:0 10px 35px rgba(31,227,156,.12)}.secondary{width:100%;margin-top:10px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(18,35,29,.72);color:var(--text);font-weight:700}.searchbox{display:flex;gap:8px;margin-top:12px}.searchbox input{min-width:0;flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:0}.searchbox input:focus{border-color:var(--accent)}.searchbox button{padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:700}.suggestions{margin-top:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.suggestion{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.suggestion:last-child{border:0}.suggestion:hover{background:var(--panel2)}.suggestion small{color:var(--muted)}.error{color:var(--red);font-size:12px;margin-top:10px}.home-hide{opacity:0;visibility:hidden;pointer-events:none}
#app{position:fixed;inset:0}.map{position:absolute;inset:0;background:#0f1d19}.topbar{position:absolute;z-index:500;top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:center}.glass{background:rgba(10,24,19,.88);border:1px solid var(--line);backdrop-filter:blur(14px);color:var(--text)}.back{width:44px;height:44px;border-radius:13px;font-size:20px}.place{padding:0 15px;height:44px;border-radius:13px;display:flex;align-items:center;font-weight:700}.fuelbar{position:absolute;z-index:500;top:68px;left:14px;right:14px;display:flex;gap:6px;overflow:auto}.fuel{padding:9px 13px;border-radius:999px;white-space:nowrap}.fuel.on{background:var(--accent);color:#06231a;border-color:var(--accent);font-weight:800}.loc{position:absolute;z-index:500;right:14px;bottom:190px;width:44px;height:44px;border-radius:13px;font-size:18px}.results{position:absolute;z-index:500;left:14px;right:14px;bottom:14px;max-height:155px;overflow:auto;padding:12px;border-radius:17px}.results-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.results-title{font:700 12px 'DM Mono';text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.count{font:11px 'DM Mono';color:var(--accent)}.station{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer}.station-main{min-width:0;flex:1}.station-name{font-weight:700;font-size:13px}.station-meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font:500 18px 'DM Mono';color:var(--accent);white-space:nowrap}.price small{font-size:9px;color:var(--muted)}.detail{position:absolute;z-index:800;right:14px;top:14px;width:min(380px,calc(100vw - 28px));padding:18px;border-radius:18px;display:none}.detail.open{display:block}.close{float:right;width:32px;height:32px;border-radius:9px;background:var(--panel2);color:var(--muted)}.detail h2{font:800 24px 'Bricolage Grotesque';margin:15px 0 3px}.detail .address{font-size:12px;color:var(--muted);line-height:1.5}.prices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:16px 0}.pricebox{padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}.pricebox b{display:block;font:500 19px 'DM Mono';margin-top:5px}.go{display:block;text-align:center;padding:12px;border-radius:11px;background:var(--accent);color:#06231a;font-weight:800;text-decoration:none}.cluster{background:var(--accent);border:3px solid rgba(255,255,255,.75);color:#06231a;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 12px 'DM Mono';box-shadow:0 4px 14px rgba(0,0,0,.3)}.mk{background:#0c1b16;border:2px solid var(--accent);border-radius:10px;padding:4px 6px;color:var(--accent);font:500 10px 'DM Mono';box-shadow:0 3px 10px #0008}.leaflet-container{background:#0d1814;font-family:'Hanken Grotesk',sans-serif}.leaflet-control-zoom{display:none}
@media(max-width:700px){.results{max-height:190px}.detail{top:auto;bottom:14px}.logo{margin-bottom:36px}}
</style>
</head>
<body>
<section id="home">
  <div class="home-card">
    <div class="logo">Gasolina<span>Go</span></div>
    <div class="eyebrow">Precios oficiales · España</div>
    <h1>Encuentra la gasolina más barata.</h1>
    <p>Elige dónde quieres repostar y te enseñamos las mejores opciones cerca de ti.</p>
    <button id="useLocation" class="primary">📍 Usar mi ubicación</button>
    <div class="searchbox"><input id="searchInput" placeholder="Buscar ciudad o municipio…" autocomplete="off"><button id="searchBtn">Buscar</button></div>
    <div id="suggestions" class="suggestions" hidden></div>
    <button id="explore" class="secondary">🗺️ Explorar España</button>
    <div id="homeError" class="error"></div>
  </div>
</section>
<main id="app">
  <div id="map" class="map"></div>
  <div class="topbar"><button id="back" class="glass back">←</button><div id="place" class="glass place">Selecciona una zona</div></div>
  <div class="fuelbar"><button class="glass fuel on" data-fuel="g95">Gasolina 95</button><button class="glass fuel" data-fuel="g98">Gasolina 98</button><button class="glass fuel" data-fuel="diesel">Diésel</button></div>
  <button id="myLocation" class="glass loc" title="Mi ubicación">⌖</button>
  <section id="results" class="glass results"><div class="results-head"><span class="results-title">Más baratas cerca</span><span id="count" class="count">—</span></div><div id="stationList"></div></section>
  <section id="detail" class="glass detail"><button id="closeDetail" class="close">×</button><div class="eyebrow">Gasolinera</div><h2 id="detailName"></h2><div id="detailAddress" class="address"></div><div id="detailPrices" class="prices"></div><a id="directions" class="go" target="_blank" rel="noopener">Cómo llegar</a></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const home=document.getElementById('home'), app=document.getElementById('app'), errorEl=document.getElementById('homeError');
const searchInput=document.getElementById('searchInput'), suggestions=document.getElementById('suggestions');
let map, cluster, stations=[], fuel='g95', selectedOrigin=null, selectedPlace='';
const fmt=p=>p==null?'—':Number(p).toFixed(3).replace('.',',')+' €';
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function showApp(place){selectedPlace=place||'Zona seleccionada';document.getElementById('place').textContent=selectedPlace;home.classList.add('home-hide');app.style.display='block';setTimeout(()=>map.invalidateSize(),50)}
function initMap(){if(map)return;map=L.map('map',{zoomControl:false,preferCanvas:true,minZoom:5,maxZoom:18});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);cluster=L.markerClusterGroup({maxClusterRadius:55,disableClusteringAtZoom:14,showCoverageOnHover:false,spiderfyOnMaxZoom:true,iconCreateFunction:c=>{const n=c.getChildCount();const size=n>500?62:n>100?54:n>20?46:40;return L.divIcon({html:'<div class="cluster" style="width:'+size+'px;height:'+size+'px">'+n+'</div>',className:'',iconSize:[size,size]})}});map.addLayer(cluster);}
async function loadArea(lat,lng,place,province='',radius=20){errorEl.textContent='';showApp(place);initMap();map.setView([lat,lng],12);document.getElementById('stationList').innerHTML='<div class="station-meta" style="padding:8px">Buscando gasolineras…</div>';try{const r=await fetch('/api/precios?lat='+encodeURIComponent(lat)+'&lng='+encodeURIComponent(lng)+'&provincia='+encodeURIComponent(province)+'&radio='+radius);const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudieron cargar los precios');stations=data.estaciones||[];selectedOrigin={lat,lng};renderStations();if(stations.length){const b=L.latLngBounds(stations.map(s=>[s.lat,s.lng]));map.fitBounds(b.pad(.08),{maxZoom:13});}else document.getElementById('stationList').innerHTML='<div class="station-meta" style="padding:8px">No hay gasolineras en esta zona.</div>';}catch(e){document.getElementById('stationList').innerHTML='<div class="station-meta" style="padding:8px;color:var(--red)">'+e.message+'</div>';}}
async function useLocation(){if(!navigator.geolocation){errorEl.textContent='Tu navegador no permite obtener la ubicación.';return}errorEl.textContent='Obteniendo tu ubicación…';navigator.geolocation.getCurrentPosition(p=>loadArea(p.coords.latitude,p.coords.longitude,'Cerca de ti','',20),()=>{errorEl.textContent='No hemos podido obtener tu ubicación. Puedes buscar una ciudad.'},{enableHighAccuracy:false,timeout:8000,maximumAge:300000})}
async function search(){const q=searchInput.value.trim();if(!q)return;suggestions.hidden=false;suggestions.innerHTML='<div class="suggestion">Buscando…</div>';try{const r=await fetch('/api/precios?q='+encodeURIComponent(q));const data=await r.json();if(!data.locations?.length){suggestions.innerHTML='<div class="suggestion">No encontramos esa localidad.</div>';return}suggestions.innerHTML=data.locations.map((x,i)=>'<button class="suggestion" data-i="'+i+'"><span>'+esc(x.nombre)+'</span><small>'+esc(x.provincia)+' · '+x.n+'</small></button>').join('');suggestions.querySelectorAll('.suggestion[data-i]').forEach(b=>b.onclick=()=>{const x=data.locations[Number(b.dataset.i)];suggestions.hidden=true;loadArea(x.lat,x.lng,x.nombre+' · '+x.provincia,x.provincia,20)});}catch(e){suggestions.innerHTML='<div class="suggestion">Error al buscar.</div>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderStations(){cluster.clearLayers();const sorted=[...stations].filter(s=>s[fuel]!=null).sort((a,b)=>(a[fuel]??99)-(b[fuel]??99));sorted.forEach(s=>{const price=fmt(s[fuel]).replace(' €','');const icon=L.divIcon({html:'<div class="mk">'+price+'</div>',className:'',iconAnchor:[22,14]});const m=L.marker([s.lat,s.lng],{icon});m.on('click',()=>openDetail(s));cluster.addLayer(m)});document.getElementById('count').textContent=sorted.length+' estaciones';document.getElementById('stationList').innerHTML=sorted.slice(0,8).map((s,i)=>'<div class="station" data-id="'+esc(s.id)+'"><div class="station-main"><div class="station-name">'+esc(s.marca||'Gasolinera')+'</div><div class="station-meta">'+esc(s.municipio)+(s.dist!=null?' · '+s.dist.toFixed(1).replace('.',',')+' km':'')+'</div></div><div class="price">'+fmt(s[fuel]).replace(' €','')+'<small> €/L</small></div></div>').join('');document.querySelectorAll('.station').forEach(el=>el.onclick=()=>{const s=stations.find(x=>String(x.id)===String(el.dataset.id));if(s){map.setView([s.lat,s.lng],15);openDetail(s)}})}
function openDetail(s){document.getElementById('detail').classList.add('open');document.getElementById('detailName').textContent=s.marca||'Gasolinera';document.getElementById('detailAddress').textContent=[s.dir,s.municipio,s.provincia].filter(Boolean).join(' · ');document.getElementById('detailPrices').innerHTML=[['Gasolina 95',s.g95],['Gasolina 98',s.g98],['Diésel',s.diesel],['Diésel premium',s.dieselPlus]].map(x=>'<div class="pricebox"><span>'+x[0]+'</span><b>'+fmt(x[1])+'</b></div>').join('');document.getElementById('directions').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.lat+','+s.lng)}
document.getElementById('useLocation').onclick=useLocation;document.getElementById('searchBtn').onclick=search;searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.getElementById('explore').onclick=()=>{loadArea(40.4168,-3.7038,'España','',40);map.setView([40.4,-3.7],6)};document.getElementById('back').onclick=()=>{home.classList.remove('home-hide');document.getElementById('detail').classList.remove('open')};document.getElementById('closeDetail').onclick=()=>document.getElementById('detail').classList.remove('open');document.getElementById('myLocation').onclick=useLocation;document.querySelectorAll('.fuel').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fuel').forEach(x=>x.classList.remove('on'));b.classList.add('on');fuel=b.dataset.fuel;renderStations()});
</script>
</body>
</html>
