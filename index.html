<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GasolinaGo — encuentra la gasolina más barata</title>
<meta name="description" content="Encuentra las gasolineras más baratas cerca de ti con precios oficiales de España.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{--bg:#07110d;--panel:#10201a;--panel2:#152820;--line:rgba(235,247,241,.13);--text:#f2faf6;--muted:#8ea79d;--accent:#20e39b;--accent2:#9af5d0;--red:#ff7568}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',sans-serif}button,input{font:inherit}button{cursor:pointer}body{overflow:hidden}.hidden{display:none!important}
#home{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;background:radial-gradient(ellipse at 50% 12%,#1b4937 0,#0c2119 32%,#07110d 72%)}#home:before{content:'';position:absolute;width:700px;height:700px;border-radius:50%;border:1px solid rgba(32,227,155,.08);top:-520px;left:50%;transform:translateX(-50%)}.home-card{position:relative;width:min(620px,100%);text-align:center}.logo{font:800 30px 'Bricolage Grotesque';letter-spacing:-.04em;margin-bottom:72px}.logo span{color:var(--accent)}.eyebrow{font:500 11px 'DM Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:15px}.home-card h1{font:800 clamp(42px,7vw,70px) 'Bricolage Grotesque';line-height:.94;letter-spacing:-.055em;margin:0 0 20px}.home-card p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 auto 30px;max-width:470px}.searchbox{display:flex;gap:8px;margin:0 auto;position:relative;max-width:560px}.searchbox input{flex:1;min-width:0;padding:16px 17px;border-radius:15px;border:1px solid var(--line);background:rgba(15,30,24,.9);color:var(--text);outline:0;box-shadow:0 10px 35px #0003}.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(32,227,155,.08)}.searchbox button{padding:0 20px;border-radius:15px;border:1px solid var(--accent);background:var(--accent);color:#06231a;font-weight:800}.suggestions{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:20;text-align:left;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#10201a;box-shadow:0 22px 55px #0009}.suggestion{display:flex;width:100%;justify-content:space-between;gap:12px;padding:14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left}.suggestion:last-child{border:0}.suggestion:hover,.suggestion.active{background:var(--panel2)}.suggestion-main{min-width:0}.suggestion-name{font-weight:700}.suggestion-sub,.suggestion-count,.search-hint{font-size:11px;color:var(--muted)}.suggestion-sub{margin-top:3px}.suggestion-count{font-family:'DM Mono';white-space:nowrap;align-self:center}.search-hint{margin-top:10px}.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px auto 0;max-width:560px}.primary,.secondary{width:100%;border-radius:14px;padding:14px 18px;font-weight:800}.primary{border:1px solid var(--line);background:rgba(21,40,32,.85);color:var(--text)}.secondary{border:1px solid var(--line);background:transparent;color:var(--muted)}.primary:hover,.secondary:hover{border-color:rgba(32,227,155,.5);color:var(--text)}.error{min-height:18px;color:var(--red);font-size:12px;margin-top:10px}
#app{position:fixed;inset:0}.map{position:absolute;inset:0}.glass{background:rgba(9,22,17,.91);border:1px solid var(--line);backdrop-filter:blur(14px);color:var(--text);box-shadow:0 8px 30px #0004}.topbar{position:absolute;z-index:500;top:14px;left:14px;right:14px;display:flex;gap:8px}.back{width:44px;height:44px;border-radius:13px;border:1px solid var(--line)}.place{height:44px;padding:0 15px;border-radius:13px;display:flex;align-items:center;font-weight:700}.fuelbar{position:absolute;z-index:500;top:68px;left:14px;display:flex;gap:6px}.fuel{padding:9px 13px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}.fuel.on{background:var(--accent);color:#06231a;border-color:var(--accent);font-weight:800}.loc{position:absolute;z-index:500;right:14px;bottom:205px;width:44px;height:44px;border-radius:13px;border:1px solid var(--line)}.results{position:absolute;z-index:500;left:14px;right:14px;bottom:14px;max-height:200px;overflow:auto;padding:12px;border-radius:17px}.results-head{display:flex;justify-content:space-between;margin-bottom:6px}.results-title{font:700 11px 'DM Mono';text-transform:uppercase;color:var(--muted)}.count{font:11px 'DM Mono';color:var(--accent)}.station{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}.station-main{flex:1;min-width:0}.station-name{font-weight:700;font-size:13px}.station-meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font:500 18px 'DM Mono';color:var(--accent);white-space:nowrap}.detail{position:absolute;z-index:800;right:14px;top:14px;width:min(380px,calc(100vw - 28px));padding:18px;border-radius:18px;display:none}.detail.open{display:block}.close{float:right;width:32px;height:32px;border-radius:9px;border:0;background:var(--panel2);color:var(--muted)}.detail h2{font:800 24px 'Bricolage Grotesque';margin:15px 0 3px}.address{font-size:12px;color:var(--muted);line-height:1.5}.prices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:16px 0}.pricebox{padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}.pricebox b{display:block;font:500 19px 'DM Mono';margin-top:5px}.go{display:block;text-align:center;padding:12px;border-radius:11px;background:var(--accent);color:#06231a;font-weight:800;text-decoration:none}.cluster-icon{background:var(--accent);border:3px solid rgba(255,255,255,.85);color:#06231a;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 12px 'DM Mono';box-shadow:0 4px 14px #0005}.price-marker{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0c1b16;border:2px solid var(--accent);color:var(--accent);font:500 10px/1 'DM Mono';white-space:nowrap;text-align:center;box-shadow:0 3px 10px #0008}.price-marker span{display:block;line-height:1;transform:translateY(1px)}.leaflet-container{background:#0d1814}.leaflet-control-zoom{display:none}@media(min-width:800px){.results{left:14px;right:auto;width:390px;bottom:14px;max-height:360px}.loc{bottom:390px}}@media(max-width:600px){.logo{margin-bottom:55px}.home-actions{grid-template-columns:1fr}.home-card p{font-size:15px}.searchbox button{padding:0 15px}.home-card h1{font-size:clamp(40px,13vw,58px)}}
</style>
</head>
<body>
<section id="home"><div class="home-card"><div class="logo">Gasolina<span>Go</span></div><div class="eyebrow">El radar de precios de España</div><h1>¿Dónde quieres repostar?</h1><p>Busca tu ciudad y descubre las gasolineras más baratas con precios oficiales.</p><div class="searchbox"><input id="searchInput" placeholder="Madrid, Bilbao, Valencia…" autocomplete="off" aria-label="Buscar ciudad o municipio"><button id="searchBtn" type="button">Buscar</button><div id="suggestions" class="suggestions hidden"></div></div><div class="search-hint">Empieza a escribir para ver localidades.</div><div class="home-actions"><button id="useLocation" class="primary">📍 Usar mi ubicación</button><button id="explore" class="secondary">🗺️ Explorar España</button></div><div id="homeError" class="error"></div></div></section>
<main id="app" class="hidden"><div id="map" class="map"></div><div class="topbar"><button id="back" class="glass back">←</button><div id="place" class="glass place">Zona seleccionada</div></div><div class="fuelbar"><button class="glass fuel on" data-fuel="g95">Gasolina 95</button><button class="glass fuel" data-fuel="g98">Gasolina 98</button><button class="glass fuel" data-fuel="diesel">Diésel</button></div><button id="myLocation" class="glass loc" title="Mi ubicación">⌖</button><section class="glass results"><div class="results-head"><span class="results-title">Más baratas cerca</span><span id="count" class="count">—</span></div><div id="stationList"></div></section><section id="detail" class="glass detail"><button id="closeDetail" class="close">×</button><div class="eyebrow">Gasolinera</div><h2 id="detailName"></h2><div id="detailAddress" class="address"></div><div id="detailPrices" class="prices"></div><a id="directions" class="go" target="_blank" rel="noopener">Cómo llegar</a></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const $=id=>document.getElementById(id);let map=null,cluster=null,stations=[],fuel='g95',origin=null,searchTimer=null,searchController=null,searchResults=[],activeSuggestion=-1,searchCache=new Map(),moveTimer=null,loadingViewport=false;const fmt=p=>p==null?'—':Number(p).toFixed(3).replace('.',',')+' €';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function initMap(){if(map)return;map=L.map('map',{zoomControl:false,minZoom:5,maxZoom:18});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);cluster=L.markerClusterGroup({maxClusterRadius:55,disableClusteringAtZoom:14,showCoverageOnHover:false,spiderfyOnMaxZoom:true,iconCreateFunction:c=>{const n=c.getChildCount(),size=n>500?62:n>100?54:n>20?46:40;return L.divIcon({html:'<div class="cluster-icon" style="width:'+size+'px;height:'+size+'px">'+n+'</div>',className:'',iconSize:[size,size]})}});map.addLayer(cluster);map.on('moveend',()=>{if(map.getZoom()>=7)queueViewportLoad()})}
function openMap(){ $('home').classList.add('hidden');$('app').classList.remove('hidden');initMap();setTimeout(()=>map.invalidateSize(),50)}
async function loadArea(lat,lng,label,province){$('homeError').textContent='';openMap();$('place').textContent=label||'Cerca de ti';origin={lat,lng};map.setView([lat,lng],12);await loadViewport(province)}
async function loadExplore(){openMap();$('place').textContent='Explorar España';map.setView([40.2,-3.7],6);await loadViewport('')}
function queueViewportLoad(){clearTimeout(moveTimer);moveTimer=setTimeout(()=>loadViewport(''),350)}
async function loadViewport(province=''){if(loadingViewport)return;const b=map.getBounds();const z=map.getZoom();if(z<7){stations=[];renderStations();return}loadingViewport=true;$('stationList').innerHTML='<div class="station-meta" style="padding:10px">Actualizando zona…</div>';try{const qs=new URLSearchParams({explore:'1',south:b.getSouth(),west:b.getWest(),north:b.getNorth(),east:b.getEast()});if(province)qs.set('provincia',province);const r=await fetch('/api/precios?'+qs.toString(),{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudieron cargar las gasolineras');stations=Array.isArray(data.estaciones)?data.estaciones:[];if(data.provincia&&data.provincia!=='España')$('place').textContent=data.provincia;renderStations();if(!stations.length)$('stationList').innerHTML='<div class="station-meta" style="padding:10px">No hay gasolineras visibles en esta zona. Acerca el zoom o mueve el mapa.</div>'}catch(e){$('stationList').innerHTML='<div class="station-meta" style="padding:10px;color:var(--red)">'+esc(e.message)+'</div>'}finally{loadingViewport=false}}
function useLocation(){if(!navigator.geolocation){$('homeError').textContent='Tu navegador no permite obtener la ubicación.';return}$('homeError').textContent='Obteniendo tu ubicación…';navigator.geolocation.getCurrentPosition(p=>loadArea(p.coords.latitude,p.coords.longitude,'Cerca de ti',''),()=>{$('homeError').textContent='No hemos podido obtener tu ubicación. Puedes buscar una ciudad.'},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})}
function hideSuggestions(){$('suggestions').classList.add('hidden');activeSuggestion=-1}function showSuggestions(){$('suggestions').classList.remove('hidden')}
function renderSuggestions(items){searchResults=items;activeSuggestion=-1;if(!items.length){$('suggestions').innerHTML='<div class="suggestion"><div class="suggestion-main"><div class="suggestion-name">No encontramos esa localidad</div><div class="suggestion-sub">Prueba con otra ciudad o municipio.</div></div></div>';showSuggestions();return}$('suggestions').innerHTML=items.map((x,i)=>'<button type="button" class="suggestion" data-i="'+i+'"><div class="suggestion-main"><div class="suggestion-name">'+esc(x.nombre)+'</div><div class="suggestion-sub">'+esc(x.provincia)+'</div></div><div class="suggestion-count">'+x.n+' est.</div></button>').join('');[...$('suggestions').querySelectorAll('[data-i]')].forEach(b=>b.addEventListener('click',()=>selectSuggestion(Number(b.dataset.i))));showSuggestions()}
function selectSuggestion(i){const x=searchResults[i];if(!x)return;$('searchInput').value=x.nombre;hideSuggestions();loadArea(x.lat,x.lng,x.nombre+' · '+x.provincia,x.provincia)}
async function fetchSuggestions(q){const key=q.toLocaleLowerCase('es-ES');if(searchCache.has(key)){renderSuggestions(searchCache.get(key));return}if(searchController)searchController.abort();searchController=new AbortController();showSuggestions();$('suggestions').innerHTML='<div class="suggestion"><div class="suggestion-main"><div class="suggestion-name">Buscando…</div><div class="suggestion-sub">Consultando localidades</div></div></div>';try{const r=await fetch('/api/precios?q='+encodeURIComponent(q),{cache:'no-store',signal:searchController.signal});const data=await r.json();if(!r.ok)throw new Error(data.error||'Error de búsqueda');const items=Array.isArray(data.locations)?data.locations:[];searchCache.set(key,items);renderSuggestions(items)}catch(e){if(e.name==='AbortError')return;$('suggestions').innerHTML='<div class="suggestion"><div class="suggestion-main"><div class="suggestion-name">No se pudo buscar</div><div class="suggestion-sub">Inténtalo de nuevo.</div></div></div>';showSuggestions()}}
function onSearchInput(){const q=$('searchInput').value.trim();$('homeError').textContent='';clearTimeout(searchTimer);if(searchController)searchController.abort();if(q.length<2){hideSuggestions();return}searchTimer=setTimeout(()=>fetchSuggestions(q),220)}function search(){const q=$('searchInput').value.trim();if(q.length<2){$('homeError').textContent='Escribe al menos 2 letras.';return}fetchSuggestions(q)}function moveSuggestion(dir){if($('suggestions').classList.contains('hidden')||!searchResults.length)return;activeSuggestion=(activeSuggestion+dir+searchResults.length)%searchResults.length;[...$('suggestions').querySelectorAll('[data-i]')].forEach((el,i)=>el.classList.toggle('active',i===activeSuggestion))}
function renderStations(){cluster.clearLayers();const sorted=stations.filter(s=>s[fuel]!=null).sort((a,b)=>a[fuel]-b[fuel]);sorted.forEach(s=>{const value=fmt(s[fuel]).replace(' €','');const icon=L.divIcon({html:'<div class="price-marker"><span>'+value+'</span></div>',className:'',iconSize:[54,54],iconAnchor:[27,27]});const marker=L.marker([s.lat,s.lng],{icon});marker.on('click',()=>openDetail(s));cluster.addLayer(marker)});$('count').textContent=sorted.length+' estaciones';$('stationList').innerHTML=sorted.slice(0,10).map(s=>'<div class="station" data-id="'+esc(s.id)+'"><div class="station-main"><div class="station-name">'+esc(s.marca||'Gasolinera')+'</div><div class="station-meta">'+esc(s.municipio||s.provincia||'')+(s.dist!=null?' · '+Number(s.dist).toFixed(1).replace('.',',')+' km':'')+'</div></div><div class="price">'+fmt(s[fuel])+'</div></div>').join('')||'<div class="station-meta" style="padding:10px">No hay precios disponibles para este combustible.</div>';[...$('stationList').querySelectorAll('[data-id]')].forEach(el=>el.addEventListener('click',()=>{const s=stations.find(x=>String(x.id)===String(el.dataset.id));if(s){map.setView([s.lat,s.lng],15);openDetail(s)}}))}
function openDetail(s){$('detailName').textContent=s.marca||'Gasolinera';$('detailAddress').textContent=[s.dir,s.municipio,s.provincia].filter(Boolean).join(' · ');$('detailPrices').innerHTML='<div class="pricebox">95<b>'+fmt(s.g95)+'</b></div><div class="pricebox">98<b>'+fmt(s.g98)+'</b></div><div class="pricebox">Diésel<b>'+fmt(s.diesel)+'</b></div><div class="pricebox">Diésel+<b>'+fmt(s.dieselPlus)+'</b></div>';$('directions').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.lat+','+s.lng);$('detail').classList.add('open')}
function closeDetail(){$('detail').classList.remove('open')}function backHome(){closeDetail();$('app').classList.add('hidden');$('home').classList.remove('hidden');setTimeout(()=>map&&map.invalidateSize(),50)}
$('searchInput').addEventListener('input',onSearchInput);$('searchInput').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();moveSuggestion(1)}else if(e.key==='ArrowUp'){e.preventDefault();moveSuggestion(-1)}else if(e.key==='Enter'){e.preventDefault();if(activeSuggestion>=0)selectSuggestion(activeSuggestion);else search()}else if(e.key==='Escape'){hideSuggestions()}});$('searchBtn').addEventListener('click',search);$('useLocation').addEventListener('click',useLocation);$('explore').addEventListener('click',loadExplore);$('back').addEventListener('click',backHome);$('myLocation').addEventListener('click',useLocation);$('closeDetail').addEventListener('click',closeDetail);[...document.querySelectorAll('.fuel')].forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.fuel').forEach(x=>x.classList.remove('on'));b.classList.add('on');fuel=b.dataset.fuel;renderStations()}));document.addEventListener('click',e=>{if(e.target.closest('.searchbox'))return;hideSuggestions()});
</script>
</body>
</html>
