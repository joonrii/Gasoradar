<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GasolinaGo — gasolineras baratas en España</title><meta name="description" content="Encuentra gasolineras baratas cerca de ti con precios oficiales."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><style>
:root{--bg:#07110d;--panel:#10201a;--panel2:#172a21;--line:rgba(235,247,241,.14);--text:#f2faf6;--muted:#8ea79d;--accent:#20e39b;--red:#ff7568}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',sans-serif}button,input{font:inherit}button{cursor:pointer}.map{position:absolute;inset:0}.glass{background:rgba(9,22,17,.92);border:1px solid var(--line);backdrop-filter:blur(14px);color:var(--text);box-shadow:0 8px 30px #0005}.top{position:absolute;z-index:500;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:9px}.brand{font:800 25px 'Bricolage Grotesque';padding:8px 12px;background:rgba(7,17,13,.76);border-radius:12px}.brand span{color:var(--accent)}.search{position:relative;flex:1;max-width:620px;margin:auto}.searchrow{display:flex;gap:7px;padding:5px;border-radius:14px}.searchrow input{width:100%;border:0;outline:0;background:transparent;color:var(--text);padding:10px 12px}.searchrow input::placeholder{color:#71867d}.searchrow button{border:0;border-radius:10px;background:var(--accent);color:#06231a;font-weight:800;padding:0 17px}.suggestions{position:absolute;top:58px;left:0;right:0;border-radius:13px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 45px #0008}.hidden{display:none!important}.suggestion{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:13px;text-align:left}.suggestion:hover,.suggestion.active{background:var(--panel2)}.sub,.count{font-size:11px;color:var(--muted)}.count{font-family:'DM Mono';white-space:nowrap}.tools{position:absolute;z-index:500;top:76px;left:14px;display:flex;gap:7px}.tool{border-radius:999px;padding:8px 12px}.tool.on{background:var(--accent);color:#06231a;border-color:var(--accent);font-weight:800}.righttools{position:absolute;z-index:500;right:14px;top:76px;display:flex;gap:7px}.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line)}.status{position:absolute;z-index:450;left:14px;bottom:14px;max-width:410px;width:calc(100% - 28px);border-radius:17px;padding:13px}.statushead{display:flex;justify-content:space-between;margin-bottom:5px}.label{font:700 11px 'DM Mono';text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.stations{max-height:290px;overflow:auto}.station{display:flex;align-items:center;gap:10px;padding:10px 3px;border-top:1px solid var(--line);cursor:pointer}.stationmain{flex:1;min-width:0}.name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font:500 18px 'DM Mono';color:var(--accent);white-space:nowrap}.detail{position:absolute;z-index:800;right:14px;top:76px;width:min(390px,calc(100% - 28px));padding:17px;border-radius:17px;display:none}.detail.open{display:block}.close{float:right;border:0;background:var(--panel2);color:var(--muted);border-radius:9px;width:32px;height:32px}.detail h2{font:800 24px 'Bricolage Grotesque';margin:15px 35px 4px 0}.prices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:15px 0}.pricebox{padding:11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px}.pricebox b{display:block;font:500 18px 'DM Mono';margin-top:4px}.go{display:block;text-align:center;background:var(--accent);color:#06231a;text-decoration:none;border-radius:10px;padding:11px;font-weight:800}.cluster-icon{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);border:3px solid #fff;color:#06231a;font:800 12px 'DM Mono';box-shadow:0 4px 14px #0005}.price-marker{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0b1a15;border:2px solid var(--accent);color:var(--accent);font:500 10px/1 'DM Mono';text-align:center;box-shadow:0 3px 10px #0008}.leaflet-container{background:#0d1814}.leaflet-control-zoom{display:none}.leaflet-control-attribution{background:#07110dcc!important;color:#9aada5!important}.leaflet-control-attribution a{color:#9aada5!important}@media(max-width:700px){.top{top:9px;left:9px;right:9px}.brand{font-size:20px;padding:9px}.searchrow button{font-size:12px;padding:0 12px}.tools{top:65px;left:9px;right:9px;overflow:auto}.righttools{top:65px;right:9px}.status{left:9px;bottom:9px;width:calc(100% - 18px);max-height:37vh}.stations{max-height:22vh}.detail{top:auto;right:9px;left:9px;bottom:9px;width:auto}.suggestions{top:55px}}
</style></head><body><main id="app"><div id="map" class="map"></div><header class="top"><div class="brand">Gasolina<span>Go</span></div><div class="search"><div class="glass searchrow"><input id="searchInput" autocomplete="off" placeholder="Buscar ciudad o municipio…" aria-label="Buscar ciudad o municipio"><button id="searchBtn">Buscar</button></div><div id="suggestions" class="suggestions hidden"></div></div></header><div class="tools"><button class="glass tool on" data-fuel="g95">95</button><button class="glass tool" data-fuel="g98">98</button><button class="glass tool" data-fuel="diesel">Diésel</button></div><div class="righttools"><button id="myLocation" class="glass iconbtn" title="Usar mi ubicación">⌖</button><button id="spain" class="glass iconbtn" title="Ver España">ES</button></div><section class="glass status"><div class="statushead"><span id="area" class="label">España</span><span id="count" class="count">Acerca el mapa para cargar precios</span></div><div id="stations" class="stations"></div></section><section id="detail" class="glass detail"><button id="close" class="close">×</button><div class="label">Gasolinera</div><h2 id="detailName"></h2><div id="detailAddress" class="sub"></div><div id="detailPrices" class="prices"></div><a id="directions" class="go" target="_blank" rel="noopener">Cómo llegar</a></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script><script>
const $=id=>document.getElementById(id);let map,cluster,stations=[],fuel='g95',timer,controller,requestId=0,results=[],active=-1,searchController,cache=new Map();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=p=>p==null?'—':Number(p).toFixed(3).replace('.',',')+' €';
function init(){map=L.map('map',{zoomControl:false,minZoom:5,maxZoom:18});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);cluster=L.markerClusterGroup({maxClusterRadius:55,disableClusteringAtZoom:14,showCoverageOnHover:false,spiderfyOnMaxZoom:true,iconCreateFunction:c=>{let n=c.getChildCount(),s=n>500?62:n>100?54:n>20?46:40;return L.divIcon({html:'<div class="cluster-icon" style="width:'+s+'px;height:'+s+'px">'+n+'</div>',className:'',iconSize:[s,s]})}});map.addLayer(cluster);map.setView([40.3,-3.7],6);map.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(loadViewport,300)})}
async function loadViewport(){if(map.getZoom()<7){if(controller)controller.abort();requestId++;stations=[];render();$('count').textContent='Acerca el mapa para cargar precios';return}let id=++requestId;if(controller)controller.abort();controller=new AbortController();let b=map.getBounds(),q=new URLSearchParams({explore:'1',south:b.getSouth(),west:b.getWest(),north:b.getNorth(),east:b.getEast()});$('count').textContent='Actualizando…';try{let r=await fetch('/api/precios?'+q,{cache:'no-store',signal:controller.signal}),d=await r.json();if(id!==requestId)return;if(!r.ok)throw Error(d.error||'No se pudieron cargar los precios');stations=Array.isArray(d.estaciones)?d.estaciones:[];$('area').textContent=d.provincia&&d.provincia!=='España'?d.provincia:'Zona visible';render();$('count').textContent=stations.length+' estaciones'}catch(e){if(e.name==='AbortError'||id!==requestId)return;$('count').textContent=e.message}}
function render(){cluster.clearLayers();let arr=stations.filter(s=>s[fuel]!=null).sort((a,b)=>a[fuel]-b[fuel]);arr.forEach(s=>{let v=fmt(s[fuel]).replace(' €',''),icon=L.divIcon({html:'<div class="price-marker"><span>'+v+'</span></div>',className:'',iconSize:[54,54],iconAnchor:[27,27]});let m=L.marker([s.lat,s.lng],{icon});m.on('click',()=>openDetail(s));cluster.addLayer(m)});$('stations').innerHTML=arr.slice(0,12).map(s=>'<div class="station" data-id="'+esc(s.id)+'"><div class="stationmain"><div class="name">'+esc(s.marca||'Gasolinera')+'</div><div class="meta">'+esc(s.municipio||s.provincia||'')+'</div></div><div class="price">'+fmt(s[fuel])+'</div></div>').join('')||'<div class="meta" style="padding:10px 3px">No hay precios visibles. Acerca o mueve el mapa.</div>';document.querySelectorAll('.station[data-id]').forEach(e=>e.onclick=()=>{let s=stations.find(x=>String(x.id)===String(e.dataset.id));if(s){map.setView([s.lat,s.lng],15);openDetail(s)}})}
function openDetail(s){$('detailName').textContent=s.marca||'Gasolinera';$('detailAddress').textContent=[s.dir,s.municipio,s.provincia].filter(Boolean).join(' · ');$('detailPrices').innerHTML=[['95',s.g95],['98',s.g98],['Diésel',s.diesel],['Diésel+',s.dieselPlus]].map(x=>'<div class="pricebox">'+x[0]+'<b>'+fmt(x[1])+'</b></div>').join('');$('directions').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.lat+','+s.lng);$('detail').classList.add('open')}function closeDetail(){$('detail').classList.remove('open')}
async function suggest(q){let k=q.toLowerCase();if(cache.has(k)){show(cache.get(k));return}if(searchController)searchController.abort();searchController=new AbortController();$('suggestions').innerHTML='<div class="suggestion">Buscando…</div>';$('suggestions').classList.remove('hidden');try{let r=await fetch('/api/precios?q='+encodeURIComponent(q),{signal:searchController.signal}),d=await r.json();if(!r.ok)throw Error();cache.set(k,d.locations||[]);show(d.locations||[])}catch(e){if(e.name!=='AbortError')show([])}}
function show(items){results=items;active=-1;if(!items.length){$('suggestions').innerHTML='<div class="suggestion"><div><b>No encontramos esa localidad</b><div class="sub">Prueba otra ciudad o municipio.</div></div></div>';$('suggestions').classList.remove('hidden');return}$('suggestions').innerHTML=items.slice(0,8).map((x,i)=>'<button type="button" class="suggestion" data-i="'+i+'"><div><b>'+esc(x.nombre)+'</b><div class="sub">'+esc(x.provincia)+'</div></div><span class="count">'+x.n+' est.</span></button>').join('');document.querySelectorAll('.suggestion[data-i]').forEach(b=>b.onclick=()=>select(Number(b.dataset.i)));$('suggestions').classList.remove('hidden')}
function select(i){let x=results[i];if(!x)return;$('searchInput').value=x.nombre;hideSuggestions();$('area').textContent=x.nombre+' · '+x.provincia;map.setView([x.lat,x.lng],12)}function hideSuggestions(){$('suggestions').classList.add('hidden');active=-1}function locate(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],12);$('area').textContent='Cerca de ti'},()=>{})}
$('searchInput').oninput=()=>{let q=$('searchInput').value.trim();clearTimeout(timer);if(q.length<2){hideSuggestions();return}timer=setTimeout(()=>suggest(q),180)};$('searchInput').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();if(results.length)active=(active+1)%results.length}else if(e.key==='ArrowUp'){e.preventDefault();if(results.length)active=(active-1+results.length)%results.length}else if(e.key==='Enter'){e.preventDefault();active>=0?select(active):results.length===1?select(0):suggest($('searchInput').value.trim())}else if(e.key==='Escape')hideSuggestions()};$('searchBtn').onclick=()=>{let q=$('searchInput').value.trim();if(q.length>=2)suggest(q)};$('myLocation').onclick=locate;$('spain').onclick=()=>{map.setView([40.3,-3.7],6);$('area').textContent='España'};$('close').onclick=closeDetail;document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('on'));b.classList.add('on');fuel=b.dataset.fuel;render()});document.addEventListener('click',e=>{if(!e.target.closest('.search'))hideSuggestions()});init();
</script></body></html>
