<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GasolinaGo — encuentra la gasolina más barata</title>
<meta name="description" content="Encuentra las gasolineras más baratas cerca de ti con precios oficiales de España.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<section id="home">
  <div class="home-card">
    <div class="logo">Gasolina<span>Go</span></div>
    <div class="eyebrow">Precios oficiales · España</div>
    <h1>Encuentra la gasolina más barata.</h1>
    <p>Busca tu ciudad, activa tu ubicación y compara precios de gasolineras cercanas en segundos.</p>
    <button id="useLocation" class="primary">📍 Usar mi ubicación</button>
    <div class="searchbox">
      <input id="searchInput" placeholder="Municipio, código postal o ciudad…" autocomplete="off" aria-label="Buscar ciudad o municipio">
      <button id="searchBtn" type="button">Buscar</button>
      <div id="suggestions" class="suggestions hidden"></div>
    </div>
    <div class="search-hint">Escribe al menos 2 letras para ver localidades.</div>
    <button id="explore" class="secondary">🗺️ Explorar España</button>
    <div id="homeError" class="error"></div>
  </div>
</section>
<main id="app" class="hidden">
  <div id="map" class="map"></div>
  <div class="topbar"><button id="back" class="glass back">←</button><div id="place" class="glass place">Zona seleccionada</div></div>
  <div class="fuelbar"><button class="glass fuel on" data-fuel="g95">Gasolina 95</button><button class="glass fuel" data-fuel="g98">Gasolina 98</button><button class="glass fuel" data-fuel="diesel">Diésel</button></div>
  <div class="radiusbar"><span>Radio</span><button class="glass radius" data-radius="5">5 km</button><button class="glass radius on" data-radius="10">10 km</button><button class="glass radius" data-radius="25">25 km</button><button class="glass radius" data-radius="40">40 km</button></div>
  <button id="myLocation" class="glass loc" title="Mi ubicación">⌖</button>
  <section class="glass results"><div class="results-head"><span class="results-title">Más baratas cerca</span><span id="count" class="count">—</span></div><div id="stationList"></div></section>
  <section id="detail" class="glass detail"><button id="closeDetail" class="close">×</button><div class="eyebrow">Gasolinera</div><h2 id="detailName"></h2><div id="detailAddress" class="address"></div><div id="detailPrices" class="prices"></div><a id="directions" class="go" target="_blank" rel="noopener">Cómo llegar</a></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="/js/search.js"></script>
<script src="/js/map.js"></script>
<script src="/js/stations.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
