<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GasolinaGo — encuentra la gasolina más barata</title>
<meta name="description" content="Encuentra las gasolineras más baratas cerca de ti con precios oficiales de España.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{--bg:#09120f;--panel:#0f1e19;--panel2:#12231d;--line:rgba(234,243,239,.12);--text:#edf7f2;--muted:#8ca79d;--accent:#1fe39c;--red:#ff6b5e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',sans-serif}button,input{font:inherit}button{cursor:pointer}body{overflow:hidden}
#home{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 18%,#16372b 0,#09120f 58%);transition:.25s}.home-card{width:min(570px,100%);text-align:center}.logo{font:800 30px 'Bricolage Grotesque';margin-bottom:55px}.logo span{color:var(--accent)}.eyebrow{font:500 11px 'DM Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}.home-card h1{font:800 clamp(40px,7vw,64px) 'Bricolage Grotesque';line-height:.98;letter-spacing:-.045em;margin:0 0 18px}.home-card p{color:var(--muted);font-size:16px;line-height:1.5;margin:0 auto 28px;max-width:450px}.primary,.secondary{width:100%;border-radius:14px;padding:15px 18px;font-weight:800}.primary{border:1px solid var(--accent);background:var(--accent);color:#06231a}.secondary{margin-top:10px;border:1px solid var(--line);background:rgba(18,35,29,.8);color:var(--text)}.searchbox{display:flex;gap:8px;margin-top:12px}.searchbox input{flex:1;min-width:0;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:0}.searchbox input:focus{border-color:var(--accent)}.searchbox button{padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:700}.suggestions{margin-top:8px;text-align:left;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}.suggestion{display:flex;width:100%;justify-content:space-between;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left}.suggestion:last-child{border:0}.suggestion:hover{background:var(--panel2)}.suggestion small{color:var(--muted)}.error{min-height:18px;color:var(--red);font-size:12px;margin-top:10px}.hidden{display:none!important}
#app{position:fixed;inset:0}.map{position:absolute;inset:0}.glass{background:rgba(10,24,19,.9);border:1px solid var(--line);backdrop-filter:blur(14px);color:var(--text)}.topbar{position:absolute;z-index:500;top:14px;left:14px;right:14px;display:flex;gap:8px}.back{width:44px;height:44px;border-radius:13px;border:1px solid var(--line)}.place{height:44px;padding:0 15px;border-radius:13px;display:flex;align-items:center;font-weight:700}.fuelbar{position:absolute;z-index:500;top:68px;left:14px;display:flex;gap:6px}.fuel{padding:9px 13px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}.fuel.on{background:var(--accent);color:#06231a;border-color:var(--accent);font-weight:800}.loc{position:absolute;z-index:500;right:14px;bottom:185px;width:44px;height:44px;border-radius:13px;border:1px solid var(--line)}.results{position:absolute;z-index:500;left:14px;right:14px;bottom:14px;max-height:190px;overflow:auto;padding:12px;border-radius:17px}.results-head{display:flex;justify-content:space-between;margin-bottom:6px}.results-title{font:700 11px 'DM Mono';text-transform:uppercase;color:var(--muted)}.count{font:11px 'DM Mono';color:var(--accent)}.station{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}.station-main{flex:1;min-width:0}.station-name{font-weight:700;font-size:13px}.station-meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font:500 18px 'DM Mono';color:var(--accent);white-space:nowrap}.detail{position:absolute;z-index:800;right:14px;top:14px;width:min(380px,calc(100vw - 28px));padding:18px;border-radius:18px;display:none}.detail.open{display:block}.close{float:right;width:32px;height:32px;border-radius:9px;border:0;background:var(--panel2);color:var(--muted)}.detail h2{font:800 24px 'Bricolage Grotesque';margin:15px 0 3px}.address{font-size:12px;color:var(--muted);line-height:1.5}.prices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:16px 0}.pricebox{padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}.pricebox b{display:block;font:500 19px 'DM Mono';margin-top:5px}.go{display:block;text-align:center;padding:12px;border-radius:11px;background:var(--accent);color:#06231a;font-weight:800;text-decoration:none}.cluster-icon{background:var(--accent);border:3px solid rgba(255,255,255,.8);color:#06231a;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 12px 'DM Mono';box-shadow:0 4px 14px #0005}.price-marker{background:#0c1b16;border:2px solid var(--accent);border-radius:10px;padding:4px 6px;color:var(--accent);font:500 10px 'DM Mono';box-shadow:0 3px 10px #0008}.leaflet-container{background:#0d1814}.leaflet-control-zoom{display:none}
@media(min-width:800px){.results{left:14px;right:auto;width:390px;bottom:14px;max-height:360px}.loc{bottom:390px}}
</style>
</head>
<body>
<section id="home">
  <div class="home-card">
    <div class="logo">Gasolina<span>Go</span></div>
    <div class="eyebrow">Precios oficiales · España</div>
    <h1>Encuentra la gasolina más barata.</h1>
    <p>Elige dónde quieres repostar y te enseñamos las mejores opciones cerca de ti.</p>
    <button id="useLocation" class="primary">📍 Usar mi ubicación</button>
    <div class="searchbox"><input id="searchInput" placeholder="Buscar ciudad o municipio…" autocomplete="off"><button id="searchBtn">Buscar</button></div>
    <div id="suggestions" class="suggestions hidden"></div>
    <button id="explore" class="secondary">🗺️ Explorar España</button>
    <div id="homeError" class="error"></div>
  </div>
</section>
<main id="app" class="hidden">
  <div id="map" class="map"></div>
  <div class="topbar"><button id="back" class="glass back">←</button><div id="place" class="glass place">Zona seleccionada</div></div>
  <div class="fuelbar"><button class="glass fuel on" data-fuel="g95">Gasolina 95</button><button class="glass fuel" data-fuel="g98">Gasolina 98</button><button class="glass fuel" data-fuel="diesel">Diésel</button></div>
  <button id="myLocation" class="glass loc">⌖</button>
  <section class="glass results"><div class="results-head"><span class="results-title">Más baratas cerca</span><span id="count" class="count">—</span></div><div id="stationList"></div></section>
  <section id="detail" class="glass detail"><button id="closeDetail" class="close">×</button><div class="eyebrow">Gasolinera</div><h2 id="detailName"></h2><div id="detailAddress" class="address"></div><div id="detailPrices" class="prices"></div><a id="directions" class="go" target="_blank" rel="noopener">Cómo llegar</a></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const $=id=>document.getElementById(id);
let map=null,cluster=null,stations=[],fuel='g95',origin=null;
const fmt=p=>p==null?'—':Number(p).toFixed(3).replace('.',',')+' €';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function initMap(){if(map)return;map=L.map('map',{zoomControl:false,minZoom:5,maxZoom:18});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);cluster=L.markerClusterGroup({maxClusterRadius:55,disableClusteringAtZoom:14,showCoverageOnHover:false,spiderfyOnMaxZoom:true,iconCreateFunction:c=>{const n=c.getChildCount(),size=n>500?62:n>100?54:n>20?46:40;return L.divIcon({html:'<div class="cluster-icon" style="width:'+size+'px;height:'+size+'px">'+n+'</div>',className:'',iconSize:[size,size]})}});map.addLayer(cluster);}
function openMap(){ $('home').classList.add('hidden');$('app').classList.remove('hidden');initMap();setTimeout(()=>map.invalidateSize(),50);}
async function loadArea(lat,lng,label,province){
  $('homeError').textContent='';openMap();$('place').textContent=label||'Cerca de ti';$('stationList').innerHTML='<div class="station-meta" style="padding:10px">Buscando gasolineras…</div>';origin={lat,lng};map.setView([lat,lng],12);
  try{
    const qs=new URLSearchParams({lat,lng,radio:'20'});if(province)qs.set('provincia',province);
    const r=await fetch('/api/precios?'+qs.toString(),{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudieron cargar los precios');
    stations=Array.isArray(data.estaciones)?data.estaciones:[];renderStations();
    if(stations.length){const bounds=L.latLngBounds(stations.map(s=>[s.lat,s.lng]));map.fitBounds(bounds.pad(.08),{maxZoom:13});}
    else $('stationList').innerHTML='<div class="station-meta" style="padding:10px">No hay gasolineras en un radio de 20 km.</div>';
  }catch(e){$('stationList').innerHTML='<div class="station-meta" style="padding:10px;color:var(--red)">'+esc(e.message)+'</div>';}
}
function useLocation(){
  if(!navigator.geolocation){$('homeError').textContent='Tu navegador no permite obtener la ubicación.';return;}
  $('homeError').textContent='Obteniendo tu ubicación…';navigator.geolocation.getCurrentPosition(p=>loadArea(p.coords.latitude,p.coords.longitude,'Cerca de ti',''),()=>{$('homeError').textContent='No hemos podido obtener tu ubicación. Puedes buscar una ciudad.'},{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}
async function search(){
  const q=$('searchInput').value.trim();if(!q)return;$('suggestions').classList.remove('hidden');$('suggestions').innerHTML='<div class="suggestion">Buscando…</div>';
  try{const r=await fetch('/api/precios?q='+encodeURIComponent(q),{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Error de búsqueda');
    if(!Array.isArray(data.locations)||!data.locations.length){$('suggestions').innerHTML='<div class="suggestion">No encontramos esa localidad.</div>';return;}
    $('suggestions').innerHTML=data.locations.map((x,i)=>'<button class="suggestion" data-i="'+i+'"><span><b>'+esc(x.nombre)+'</b></span><small>'+esc(x.provincia)+' · '+x.n+' estaciones</small></button>').join('');
    [...$('suggestions').querySelectorAll('[data-i]')].forEach(b=>b.addEventListener('click',()=>{const x=data.locations[Number(b.dataset.i)];$('suggestions').classList.add('hidden');loadArea(x.lat,x.lng,x.nombre+' · '+x.provincia,x.provincia);}));
  }catch(e){$('suggestions').innerHTML='<div class="suggestion">Error: '+esc(e.message)+'</div>';}
}
function renderStations(){
  cluster.clearLayers();const sorted=stations.filter(s=>s[fuel]!=null).sort((a,b)=>a[fuel]-b[fuel]);
  sorted.forEach(s=>{const icon=L.divIcon({html:'<div class="price-marker">'+fmt(s[fuel]).replace(' €','')+'</div>',className:'',iconAnchor:[22,14]});const marker=L.marker([s.lat,s.lng],{icon});marker.on('click',()=>openDetail(s));cluster.addLayer(marker);});
  $('count').textContent=sorted.length+' estaciones';$('stationList').innerHTML=sorted.slice(0,10).map(s=>'<div class="station" data-id="'+esc(s.id)+'"><div class="station-main"><div class="station-name">'+esc(s.marca||'Gasolinera')+'</div><div class="station-meta">'+esc(s.municipio)+' · '+Number(s.dist||0).toFixed(1).replace('.',',')+' km</div></div><div class="price">'+fmt(s[fuel])+'</div></div>').join('')||'<div class="station-meta" style="padding:10px">No hay precios disponibles para este combustible.</div>';
  [...$('stationList').querySelectorAll('[data-id]')].forEach(el=>el.addEventListener('click',()=>{const s=stations.find(x=>String(x.id)===String(el.dataset.id));if(s){map.setView([s.lat,s.lng],15);openDetail(s);}}));
}
function openDetail(s){$('detailName').textContent=s.marca||'Gasolinera';$('detailAddress').textContent=[s.dir,s.municipio,s.provincia].filter(Boolean).join(' · ');$('detailPrices').innerHTML='<div class="pricebox">95<b>'+fmt(s.g95)+'</b></div><div class="pricebox">98<b>'+fmt(s.g98)+'</b></div><div class="pricebox">Diésel<b>'+fmt(s.diesel)+'</b></div><div class="pricebox">Diésel+<b>'+fmt(s.dieselPlus)+'</b></div>';$('directions').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.lat+','+s.lng);$('detail').classList.add('open');}
function changeFuel(next){fuel=next;document.querySelectorAll('.fuel').forEach(b=>b.classList.toggle('on',b.dataset.fuel===fuel));renderStations();}
$('useLocation').addEventListener('click',useLocation);$('searchBtn').addEventListener('click',search);$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')search();});$('back').addEventListener('click',()=>{location.reload();});$('closeDetail').addEventListener('click',()=>$('detail').classList.remove('open'));$('myLocation').addEventListener('click',useLocation);document.querySelectorAll('.fuel').forEach(b=>b.addEventListener('click',()=>changeFuel(b.dataset.fuel)));
$('explore').addEventListener('click',()=>{openMap();$('place').textContent='España';map.setView([40.2,-3.7],6);$('stationList').innerHTML='<div class="station-meta" style="padding:10px">Acerca el mapa a una zona o vuelve atrás para buscar una ciudad.</div>';});
</script>
</body>
</html>
