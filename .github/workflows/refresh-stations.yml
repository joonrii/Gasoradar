name: Refresh station indexes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disabled legacy data builder
        run: echo "Station data is now fetched by the Vercel API from the official province endpoints. This legacy workflow is intentionally disabled."
