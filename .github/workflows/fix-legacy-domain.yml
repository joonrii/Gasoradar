name: Restore legacy Vercel URL until custom domain is connected

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore current Vercel deployment URL
        run: |
          sed -i 's/gasolinago-teal\.vercel\.app/gasoradar-teal.vercel.app/g' index.html README.md sitemap.xml robots.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "fix: keep current Vercel URL until custom domain is connected"; git push; fi
