name: Apply GasolinaGo desktop redesign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Apply GasolinaGo desktop redesign') }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('gasoradar-teal.vercel.app', 'gasolinago.com')
          s = s.replace('gasolinago-teal.vercel.app', 'gasolinago.com')
          s = s.replace('Gasoradar', 'GasolinaGo')
          s = s.replace('gasoradar', 'gasolinago')
          marker = '<link rel="stylesheet" href="/redesign.css">'
          if marker not in s:
              s = s.replace('</head>', f'{marker}\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply GasolinaGo desktop redesign" || exit 0
          git push
