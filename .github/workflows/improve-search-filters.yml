name: Improve search and filters UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  improve:
    if: "!contains(github.event.head_commit.message, 'feat: improve search and auto-open filters')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update UI
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = ".hud-btn{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(14,26,22,.82);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);font-size:16px;transition:border-color .15s;}"
          new = old + '''

/* Buscador principal: barra visible y centrada */
#btnBuscar{position:absolute;left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 180px));height:46px;padding:0 20px;justify-content:flex-start;gap:10px;font-size:0;border-radius:14px;text-align:left;}
#btnBuscar::before{content:"⌕";font-size:20px;line-height:1;flex:none;}
#btnBuscar::after{content:"Buscar localidad, marca o dirección…";font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#btnBuscar:hover{border-color:var(--lineS);}
@media (max-width:600px){#btnBuscar{width:calc(100vw - 112px);height:44px;padding:0 14px;}}'''
          if old not in text: raise SystemExit('HUD CSS not found')
          text = text.replace(old,new,1)
          old = '''  setTimeout(()=> map.invalidateSize(), 450);
  render(true);'''
          new = '''  setTimeout(()=> map.invalidateSize(), 450);
  render(true);
  setTimeout(()=> document.getElementById("panelFiltros").classList.add("open"), 550);'''
          if old not in text: raise SystemExit('load hook not found')
          text = text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/improve-search-filters.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/improve-search-filters.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: improve search and auto-open filters'
          git push
