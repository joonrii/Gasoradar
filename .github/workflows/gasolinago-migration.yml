name: GasolinaGo migration and performance optimization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename brand and optimize station loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              new=text.replace('Gasoradar','GasolinaGo').replace('gasoradar','gasolinago')
              if new!=text: p.write_text(new,encoding='utf-8')

          Path('api/precios.js').write_text(r'''// Fast, location-aware proxy for the Ministry's official station data.
const MINISTERIO="https://energia.serviciosmin.gob.es/ServiciosRestCarburantes/PreciosCarburantes/EstacionesTerrestres/";
const num=v=>v?parseFloat(String(v).replace(",",".")):null;
const R=6371, MAX_ESTACIONES=350;
let memoria=null, memoriaTs=0;
function distanciaKm(aLat,aLng,bLat,bLng){const dLat=(bLat-aLat)*Math.PI/180,dLng=(bLng-aLng)*Math.PI/180,la1=aLat*Math.PI/180,la2=bLat*Math.PI/180,h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return R*2*Math.asin(Math.sqrt(h));}
async function traerEspaña(){const ahora=Date.now();if(memoria&&ahora-memoriaTs<1800000)return memoria;const r=await fetch(MINISTERIO);if(!r.ok)throw new Error("El Ministerio respondió "+r.status);const data=await r.json();memoria=data.ListaEESSPrecio||[];memoriaTs=ahora;return memoria;}
function normalizar(e){return{id:e["IDEESS"],marca:e["Rótulo"],municipio:e["Municipio"],provincia:e["Provincia"],dir:e["Dirección"],horario:e["Horario"],lat:num(e["Latitud"]),lng:num(e["Longitud (WGS84)"]),g95:num(e["Precio Gasolina 95 E5"]),g98:num(e["Precio Gasolina 98 E5"]),diesel:num(e["Precio Gasoleo A"]),dieselPlus:num(e["Precio Gasoleo Premium"])}}
function getQuery(req){const q=req.query||{},lat=Number(q.lat),lng=Number(q.lng);return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null;}
function getGeoFromVercel(req){const lat=Number(req.headers["x-vercel-ip-latitude"]),lng=Number(req.headers["x-vercel-ip-longitude"]);return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null;}
export default async function handler(req,res){try{const raw=await traerEspaña();const todas=raw.map(normalizar).filter(e=>e.lat!=null&&e.lng!=null).filter(e=>e.g95||e.g98||e.diesel||e.dieselPlus);if(!todas.length)throw new Error("No se obtuvo ninguna estación");const origen=getQuery(req)||getGeoFromVercel(req);let estaciones;if(origen){estaciones=todas.map(e=>({...e,_dist:distanciaKm(origen.lat,origen.lng,e.lat,e.lng)})).sort((a,b)=>a._dist-b._dist).slice(0,MAX_ESTACIONES).map(({_dist,...e})=>e);}else{estaciones=todas.slice(0,MAX_ESTACIONES);}res.setHeader("Cache-Control","s-maxage=1800, stale-while-revalidate=3600");res.status(200).json({fecha:new Date().toLocaleString("es-ES",{timeZone:"Europe/Madrid"}),total:estaciones.length,totalEspaña:todas.length,fallidos:[],estaciones});}catch(err){res.status(500).json({error:err.message});}}
''',encoding='utf-8')

          index=Path('index.html'); text=index.read_text(encoding='utf-8')
          old='''async function cargarDatos(){
  try{
    const r = await fetch("/api/precios");
    if (!r.ok) throw new Error("respuesta "+r.status);
    const data = await r.json();
    if (!data.estaciones || !data.estaciones.length) throw new Error("sin estaciones");
