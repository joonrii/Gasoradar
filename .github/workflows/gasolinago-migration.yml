name: GasolinaGo migration and performance optimization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migration
        run: python3 scripts/migrate-gasolinago.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "feat: migrate to GasolinaGo and optimize station loading"
            git push
          fi
